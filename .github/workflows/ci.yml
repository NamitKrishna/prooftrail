name: ProofTrail CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  regression-test:
    name: Regression Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run CI regression test
        run: ./scripts/ci_check.sh