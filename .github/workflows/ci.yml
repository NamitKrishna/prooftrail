name: ProofTrail CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  regression-test:
    name: Regression Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run CI regression test
        run: ./scripts/ci_check.sh

  # Optional: Lint SQL files with sqlfluff
  sql-lint:
    name: SQL Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sqlfluff
        run: pip install sqlfluff
      - name: Lint SQL files
        run: sqlfluff lint db/