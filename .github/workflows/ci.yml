name: ProofTrail CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  regression-test:
    name: Regression Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run CI regression test
        run: ./scripts/ci_check.sh

      - name: Verify SQL syntax (dry-run)
        run: |
          # Quick syntax check on all SQL files
          for f in db/*.sql db/**/*.sql; do
            echo "Checking $f..."
            docker run --rm -i postgres:16 psql --dry-run -U postgres -d postgres < "$f" >/dev/null
          done
        # Note: This requires the postgres image to be available; in practice
        # you might want to use a separate step with services.postgres

  # Optional: Lint SQL files with sqlfluff
  sql-lint:
    name: SQL Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install sqlfluff
        run: pip install sqlfluff
      - name: Lint SQL files
        run: sqlfluff lint db/